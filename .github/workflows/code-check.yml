name: Code checks
permissions:
  contents: read

on:
  push:
    branches:
      - 'master'

  pull_request:
    branches:
      - '*'

  workflow_call:

  workflow_dispatch:

jobs:
  check:
    name: Check the code
    uses: publishpress/github-workflows/.github/workflows/code-standards.yml@v3

  dependency-security:
    name: JavaScript dependency security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check dependency security regressions
        run: npm run test:security
