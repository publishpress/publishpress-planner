name: Code checks
on:
  push:
    branches:
      - 'master'

  pull_request:
    branches:
      - '*'

  workflow_call:

  workflow_dispatch:
    inputs:
      tmate_enabled:
        type: boolean
        description: 'Enable "tmate" for debugging'
        required: false
        default: false
permissions:
  contents: read
jobs:
  check:
    name: Check the code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup tmate session for Debugging, if inputs.tmate_enabled is true
        uses: mxschmitt/action-tmate@v3
        if: ${{ inputs.tmate_enabled }}
        timeout-minutes: 10
        with:
          detached: true

      - name: Checkout code
        uses: actions/checkout@master

      - name: Create .env file
        run: |
          cp $GITHUB_WORKSPACE/.env.example $GITHUB_WORKSPACE/.env

      - name: Prepare composer
        run: |
          $GITHUB_WORKSPACE/dev-workspace/run composer validate
          $GITHUB_WORKSPACE/dev-workspace/run composer install

      - name: Show version of tools inside the dev-workspace
        run: |
          $GITHUB_WORKSPACE/dev-workspace/run composer info:versions

      - name: Run Lint check
        run: |
          $GITHUB_WORKSPACE/dev-workspace/run composer check:lint

      - name: Check PHP minimum and compatibility
        run: |
          $GITHUB_WORKSPACE/dev-workspace/run composer check:php
          $GITHUB_WORKSPACE/dev-workspace/run vendor/bin/phpcs --standard=.phpcs-php-compatibility.xml --runtime-set testVersion 5.4 publishpress.php

      - name: Verify the minimum PHP bootstrap guard
        run: |
          for version in 8.1 8.2; do
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/project:ro" -w /project \
              "php:${version}-cli" php tests/regression/minimum-php-bootstrap.php
          done
