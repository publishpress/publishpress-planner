name: Infra audit
on:
  release:
    types: [released]
  schedule:
    - cron: '15 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  vulnerability-alerts: read
  security-events: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || 'development' }}

      - name: Checkout dependency audit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: publishpress/infra
          ref: 61a991585f23a83bd70f2a6b55b6da4dffe50476 # fix(dependency-audit): keep npm scope when a lock path is missing
          token: ${{ secrets.INFRA_READ_TOKEN }}
          path: .infra-audit
          sparse-checkout: .github/actions/dependency-audit
          persist-credentials: false

      - name: Post dependency audit
        env:
          AUDIT_SOURCE: ${{ github.event_name == 'release' && 'release' || 'development' }}
          DASHBOARD_URL: ${{ secrets.INFRA_DASHBOARD_URL }}
          ENTITY_SLUG: wp-plugin-planner-free
          COMPOSER_PROD_DIR: lib
          USERNAME: ${{ secrets.INFRA_PLUGIN_USER }}
          APP_PASSWORD: ${{ secrets.INFRA_PLUGIN_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .infra-audit/.github/actions/dependency-audit/audit.sh
