name: Deploy plugin to WordPress.org
permissions:
  contents: read

on:
  release:
    types: [ released ]

  workflow_dispatch:

jobs:
  code-check:
    name: Check the code
    uses: ./.github/workflows/code-check.yml
    permissions:
      contents: read
    secrets: inherit

  deploy-wp-org:
    needs:
      - code-check
    permissions:
      contents: write
    uses: publishpress/github-workflows/.github/workflows/deploy-free.yml@v3
    with:
      stable_branch: master
    secrets: inherit
