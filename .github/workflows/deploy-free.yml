name: Deploy plugin to WordPress.org
permissions:
  contents: read

on:
  release:
    types: [ released ]

jobs:
  code-check:
    name: Check the code
    permissions:
      contents: read
    uses: ./.github/workflows/code-standards.yml
    secrets: inherit

  deploy-wp-org:
    permissions:
      contents: write
    uses: publishpress/github-workflows/.github/workflows/deploy-free.yml@v3
    needs: [code-check]
    secrets: inherit
